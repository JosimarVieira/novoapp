# Torna verdadeiro o que a estrategia-de-testes.md ja afirmava: "falha o build".
# Ate existir isto, os quatro testes obrigatorios dependiam de alguem lembrar de
# rodar `mvn test` antes do push -- exatamente o tipo de disciplina que a
# ADR-0003 diz nao funcionar.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push em cima de push cancela o anterior: o que importa e o ultimo estado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # O repositorio inteiro, nao so server/: a aceitacao le os .feature de
      # docs/03-specs direto, sem copia.
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # O runner do Ubuntu ja tem Docker, que os Testcontainers exigem: os
      # testes de RLS precisam de Postgres real, nunca H2.
      #
      # ESTE e o portao. Verde aqui significa "nada regrediu", que e a pergunta
      # que o CI precisa responder todo dia.
      #
      # `-DexcludedGroups=em-construcao` fica, embora hoje nenhuma classe leve a
      # tag: a Etapa 3 fechou em 2026-09-21 e a tag dela saiu. A exclusao existe
      # para a proxima etapa -- a suite da etapa em construcao nasce vermelha de
      # proposito, porque escopo que falta tem de ser visivel na propria suite, e
      # o placar sobe cenario a cenario.
      #
      # Ate 2026-09-21 essa suite derrubava o job inteiro, com duas
      # consequencias que ninguem tinha escolhido: o `docker build` abaixo
      # deixava de rodar durante a etapa toda (e ele existe por causa de uma
      # regressao que ja quebrou o deploy duas vezes), e uma falha de verdade nas
      # etapas fechadas viraria mais uma linha vermelha no meio das esperadas.
      #
      # E a mesma disciplina que deu runner proprio ao @saneamento na Etapa 2a:
      # escopo novo nao pinta de vermelho o portao de uma etapa fechada.
      - name: mvn test (etapas fechadas)
        working-directory: server
        run: mvn -B test -DexcludedGroups=em-construcao

      # Informativo, nunca portao: mostra o placar da etapa em construcao sem
      # derrubar o job. Com a Etapa 3 fechada nao ha classe marcada, e o passo
      # nao roda teste nenhum -- fica assim, e nao apagado, porque e o par do
      # portao acima: quem abrir a proxima etapa poe a tag na classe nova e os
      # dois passos voltam a fazer sentido juntos. Tirar a tag e o ritual que
      # marca a etapa fechada.
      - name: mvn test (etapa em construcao)
        working-directory: server
        continue-on-error: true
        run: mvn -B test -Dgroups=em-construcao -DfailIfNoSpecifiedTests=false

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: server/target/surefire-reports/
          if-no-files-found: ignore

  image:
    name: Imagem de deploy
    # So depois dos testes: nao adianta validar a imagem de codigo quebrado.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # O build de deploy da Railway pula os testes, entao ninguem mais garante
      # que o Dockerfile compila. Esta etapa cobre a regressao que ja aconteceu
      # duas vezes: o build quebrar so no deploy.
      - name: docker build
        working-directory: server
        run: docker build -t novoapp-server:ci .
