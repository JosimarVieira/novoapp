# Todo texto que o usuario le, em portugues do Brasil (ADR-0015).
#
# Este e o unico arquivo de idioma escrito e mantido completo durante a
# validacao na familia do fundador (Etapas 1-5). messages_en.properties e
# messages_es.properties entram como traducao deste quando houver pedido real ou
# na Etapa 6 -- traducao de conteudo, nao mudanca de codigo.
#
# Chave nova exige constante em MessageKey. Faltar de um dos lados quebra o
# build (MessageBundleTest).
#
# {0}, {1}... sao java.text.MessageFormat. Consequencia: apostrofo precisa ser
# dobrado ('') em texto que tenha placeholder. Evite apostrofo.

# ------------------------------------------------------------------- recibo
expense.receipt=Anotado: {0} {1}
expense.receipt.description= — {0}
receipt.household= na família "{0}"
receipt.undo.hint=Se eu errei, responda: desfazer

# ---------------------------------------------------------------- categoria
category.create.offer=Não tenho a categoria "{0}" ainda. Quer que eu crie e lance a despesa de {1} nela?\n\nResponda sim, não, ou me diga a categoria certa — por exemplo: "{2} dentro de Alimentação".
category.create.offer.without.amount=Não tenho a categoria "{0}" ainda. Quer que eu crie e lance a despesa nela?\n\nResponda sim, não, ou me diga a categoria certa — por exemplo: "{1} dentro de Alimentação".
category.choose=Foi em qual categoria a despesa de {0}?
category.choose.without.amount=Foi em qual categoria?
category.choose.footer=Responda com o número.
category.parent.is.subcategory=Não dá: {0}, e eu só consigo um nível de subcategoria.\n\nEm qual categoria principal você quer "{1}"? Pode responder com o nome dela, ou "nenhuma" para eu criar solta.
category.parent.is.subcategory.where="{0}" já é uma subcategoria
category.parent.is.subcategory.where.of="{0}" já é uma subcategoria de "{1}"

# -------------------------------------------------------------------- valor
amount.ask=Quanto foi em {0}?
amount.ask.without.category=Quanto foi?

# ------------------------------------------------------------------ estorno
reversal.receipt=Estornei: {0} {1}
reversal.receipt.by=, que {0} tinha lançado
reversal.receipt.footer=.\nEle continua no histórico, marcado como estornado.
reversal.nothing=Não encontrei nenhum lançamento em aberto para desfazer.

# --------------------------------------------------- confirmacao (ADR-0029)
# Confiança média não executa: a intenção volta ecoada e espera um sim. O eco é
# o que torna a pergunta barata de responder — quem lê reconhece o erro sem
# precisar lembrar o que escreveu.
confirm.footer=\n\nConfirma? Responda sim ou não.
confirm.expense=Entendi: {0} {1}
confirm.list.items.one=Entendi que faltou: {0}
confirm.list.items.many=Entendi que faltaram:\n{0}
confirm.mark.purchased=Entendi que você comprou: {0}
confirm.invite=Entendi: convite para {0} ({1})

# ---------------------------------------------------------------- pendencia
pending.cancelled=Cancelei a pergunta. Não estornei lançamento nenhum e não gravei nada.
pending.rejected=Certo, não fiz nada.
pending.expired=Essa pergunta ficou muito tempo sem resposta, então não valho mais o atalho aqui. Ela continua esperando por você na central de pendências do aplicativo.\n\nA pergunta era:\n{0}
pending.not.understood=Não entendi a resposta. A pergunta era:\n{0}\n\nSe preferir deixar pra lá, responda: desfazer

# ------------------------------------------------------------------ mercado
list.added.one=Anotei na lista: {0}
list.added.many=Anotei na lista:\n{0}
list.already.pending="{0}" já estava na lista.
list.already.pending.by="{0}" já estava na lista, pedido por {1}.
list.purchased=Marquei "{0}" como comprado.
list.purchase.offer="{0}" não estava na lista. Quer que eu registre como comprado assim mesmo?\n\nResponda sim ou não.
list.empty=Não está faltando nada na lista.
list.pending=Está faltando:\n{0}
list.item.quantity={0} ({1})
list.item.quantity.unit={0} ({1} {2})

# ------------------------------------------------------------------ convite
invite.issued=Convite criado para {0} ({1}), válido até {2}.\n\n{3}\n\nEu não consigo mandar esse link para {0} — passe você mesmo, por onde vocês já conversam.
invite.not.owner=Só quem é responsável pela família pode convidar alguém.
invite.already.pending=Já existe um convite em aberto para {0}. Peça para a pessoa usar o link que você já tem.
invite.ask.contact=Você foi convidado para a família "{0}".\n\nPara confirmar que o convite é seu, compartilhe o seu contato usando o botão do Telegram.
invite.accepted=Pronto: você agora faz parte da família "{0}".
# Não ensina como trocar de família ativa: a ADR-0007 decide que a troca é por
# comando explícito no chat, e esse comando ainda não existe. Prometê-lo aqui
# fazia o bot instruir uma ação que ele recusa. O aviso de para onde as
# mensagens vão continua — é o que a ADR-0007 exige para erro de contexto ser
# visível.
invite.accepted.other.households=Pronto: você agora faz parte da família "{0}" também.\n\nAtenção: suas mensagens continuam indo para a família "{1}".
invite.phone.mismatch=Este convite não é para o seu número. Confira com quem te convidou.
invite.expired=Este convite expirou. Peça um convite novo para quem te convidou.
invite.already.used=Este convite já foi usado.
invite.not.found=Não encontrei este convite.

# --------------------------------------------------------------- onboarding
onboarding.welcome=Oi! Por aqui você registra as despesas, a lista de mercado e as tarefas da sua família, sem precisar abrir aplicativo nenhum.\n\nPara começar, seu número precisa estar vinculado a uma família. Entrar numa família que já existe só é possível por convite de quem já faz parte dela — peça o link para essa pessoa.\n\nQuer criar uma família nova? Responda sim ou não.
onboarding.declined=Tudo bem. Quando quiser criar a sua família, é só me dizer. Se alguém da sua família já usa o aplicativo, peça o link de convite para essa pessoa.
onboarding.ask.household.name=Como você quer chamar a sua família? Pode ser o sobrenome, por exemplo: Silva
onboarding.household.created=Pronto: a família "{0}" foi criada e você é o responsável por ela.\n\nQuer terminar a configuração por aqui mesmo, pelo chat, ou prefere pelo aplicativo?
onboarding.app.not.available=O aplicativo web ainda não está disponível nesta etapa — ele vem depois.\n\nDá para fazer tudo por aqui pelo chat. Quer continuar a configuração por aqui?
onboarding.continuing.by.chat=Combinado, seguimos por aqui. Para registrar uma despesa, é só mandar algo como: mercado 50
onboarding.choose.household=Você participa de mais de uma família. Para qual delas é esta mensagem?\n{0}

# ---------------------------------------------------------------- genericos
option.line={0}) {1}
bullet.line=- {0}
not.understood=Não entendi essa. Tente algo como: mercado 50
# Não afirma "não gravei nada": o orquestrador não é transacional (a chamada ao
# LLM não pode segurar conexão de banco), então cada passo já commitou o seu
# quando este texto sai. Prometer atomicidade que o código não tem é pior que
# admitir a dúvida.
failure=Deu erro aqui no meio do processamento. Não consigo garantir o que chegou a ser gravado — confira antes de repetir, pra não lançar duas vezes.
