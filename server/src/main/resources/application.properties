# ---------------------------------------------------------------------------
# Banco: dois datasources, tres papeis (ADR-0003, ADR-0022)
# ---------------------------------------------------------------------------
# admin      -- dono do schema, usado SO pelo Flyway. Nunca serve requisicao.
# <default>  -- novoapp_runtime, NOINHERIT: sem SET ROLE nao le nem escreve nada.
#               Os interceptores de com.novoapp.common.tenancy e que escolhem,
#               por transacao, se a sessao roda como novoapp_app (dominio) ou
#               novoapp_identity (pre-tenant).

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${NOVOAPP_DB_RUNTIME_USER:novoapp_runtime}
quarkus.datasource.password=${NOVOAPP_DB_RUNTIME_PASSWORD:novoapp}
quarkus.datasource.jdbc.url=${NOVOAPP_DB_URL:jdbc:postgresql://localhost:5432/novoapp}
# Sem isso o Hibernate abriria conexao no boot so pra descobrir a versao do
# banco -- e nesse momento o papel de runtime ainda nem existe.
quarkus.datasource.db-version=16.0

quarkus.datasource.admin.db-kind=postgresql
quarkus.datasource.admin.username=${NOVOAPP_DB_ADMIN_USER:postgres}
quarkus.datasource.admin.password=${NOVOAPP_DB_ADMIN_PASSWORD:postgres}
quarkus.datasource.admin.jdbc.url=${NOVOAPP_DB_URL:jdbc:postgresql://localhost:5432/novoapp}

quarkus.flyway.migrate-at-start=false
quarkus.flyway.admin.migrate-at-start=true
quarkus.flyway.admin.locations=db/migration
# Senha do papel de runtime, criada pela V1. Rotacionar depois exige ALTER ROLE
# manual: migration com checksum fixo nao roda de novo (ver README).
quarkus.flyway.admin.placeholders.runtimepwd=${NOVOAPP_DB_RUNTIME_PASSWORD:novoapp}

# O schema e do Flyway; o Hibernate nunca mexe nele.
quarkus.hibernate-orm.schema-management.strategy=none

# ---------------------------------------------------------------------------
# Canal (ADR-0002, ADR-0008)
# ---------------------------------------------------------------------------
novoapp.channel.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
# Segredo que o Telegram devolve no header a cada entrega. Vazio desliga a
# verificacao -- aceitavel so em desenvolvimento local.
novoapp.channel.telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
quarkus.rest-client.telegram-api.url=https://api.telegram.org

# ---------------------------------------------------------------------------
# LLM (ADR-0004, ADR-0009)
# ---------------------------------------------------------------------------
quarkus.langchain4j.mistralai.api-key=${MISTRAL_API_KEY:}
# Versao explicita, e nao o alias "-latest": a pagina de limites da conta lista
# versoes concretas, e o limite que vale e o dela.
#
# ministral-8b e nao mistral-small: no tier gratuito, mistral-small-2603 tem
# 1,00 requisicao por segundo e 20.000 tokens por minuto, enquanto
# ministral-8b-2512 tem 3,13 RPS e 625.000 TPM. O LangChain4j tenta tres vezes
# em cerca de 1,7s quando falha, e a extensao do Quarkus nao expoe configuracao
# de retry -- com 1 RPS o proprio retry estoura o limite. Ministral 8B suporta
# function calling, que e o que a ADR-0004 exige.
quarkus.langchain4j.mistralai.chat-model.model-name=ministral-8b-2512
quarkus.langchain4j.mistralai.chat-model.temperature=0
quarkus.langchain4j.mistralai.timeout=20s

# ---------------------------------------------------------------------------
# Teste: Postgres real, LLM e canal stubbados (estrategia-de-testes.md)
# ---------------------------------------------------------------------------
%test.quarkus.devservices.enabled=false
%test.novoapp.channel.async=false
%test.novoapp.channel.telegram.bot-token=stub
%test.novoapp.channel.telegram.webhook-secret=
%test.quarkus.langchain4j.mistralai.api-key=stub

%dev.quarkus.log.category."com.novoapp".level=DEBUG

# ---------------------------------------------------------------------------
# Producao
# ---------------------------------------------------------------------------
# A plataforma decide a porta e injeta em PORT. O Telegram so entrega webhook
# em HTTPS nas portas 443, 80, 88 ou 8443 -- quem faz esse mapeamento e o proxy
# da plataforma, nao a aplicacao.
%prod.quarkus.http.port=${PORT:8080}
